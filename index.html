function month(n){eventsMonth=new Date(eventsMonth.getFullYear(),eventsMonth.getMonth()+n,1);render()}
function eventModal(d){modal(`<h2>إضافة حدث</h2><div class="field"><label>اسم الحدث</label><input id="evtitle"></div><div class="field"><label>التاريخ</label><input id="evdate" type="date" value="${d||selDate||new Date().toISOString().slice(0,10)}"></div><div class="field"><label>الوقت</label><input id="evtime" type="time"></div><div class="field"><label>ملاحظة</label><input id="evnote"></div><button class="btn" onclick="saveEvent()">حفظ</button>`)}
function saveEvent(){let title=$("evtitle").value.trim(),date=$("evdate").value;if(!title||!date)return toast("أدخل اسم الحدث والتاريخ");s.events.push({title,date,time:$("evtime").value,note:$("evnote").value});save();close();render();if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();toast("تم حفظ الحدث")}
function addFriend(){let f=$("friend").value.trim().replace(/^@/,"");if(!f)return toast("اكتب اسم المستخدم");if(!s.friends.includes(f))s.friends.push(f);save();render()}
function chat(f){modal(`<h2>مراسلة ${esc(f)}</h2><p class="muted small">الرسالة تحفظ على هذا الجهاز فقط، وليست مرسلة لحساب آخر.</p><textarea id="msg" placeholder="اكتب رسالة"></textarea><button class="btn" onclick="sendMsg('${f.replace(/'/g,"")}')">حفظ الرسالة</button>`)}
function sendMsg(f){let t=$("msg").value.trim();if(!t)return toast("اكتب رسالة");s.messages.push({to:f,text:t});save();close();render()}
function editProfile(){modal(`<h2>تعديل الملف الشخصي</h2><div class="field"><label>الاسم</label><input id="newname" value="${esc(s.name)}"></div><p>اختر صورتك</p><div class="choicegrid">${["👩🏻‍🚀","🧑🏽‍🚀","👨🏻‍🚀","👽","🦊","🐱","🐼","🦄","🤖"].map(x=>`<button class="choice" onclick="picked='${x}'">${x}</button>`).join("")}</div><button class="btn" onclick="s.name=$('newname').value.trim()||s.name;s.avatar=picked;save();close();render()">حفظ</button>`)}
function settings(which){let account=`<h2>الحساب</h2><div class="field"><label>الاسم</label><input id="setname" value="${esc(s.name)}"></div><div class="field"><label>البريد</label><input value="${esc(s.email)}" disabled></div><button class="btn secondary" onclick="changePass()">تغيير كلمة المرور عبر البريد</button><button class="btn" onclick="s.name=$('setname').value.trim()||s.name;save();settings('account')">حفظ الاسم</button>`;
let prayer=`<h2>الصلاة</h2><div class="field"><label>المدينة</label><select id="city">${["مكة المكرمة","جدة","الرياض","المدينة المنورة","الدمام","الطائف","أبها","تعديل يدوي"].map(x=>`<option ${s.city===x?"selected":""}>${x}</option>`).join("")}</select></div><p class="muted small">الأوقات قابلة للتعديل يدويًا؛ هذه النسخة لا تجلب مواقيت موثوقة تلقائيًا.</p>${Object.entries(s.times).map(([k,v])=>`<div class="field"><label>${k}</label><input type="time" id="time${k}" value="${v}"></div>`).join("")}<label><input id="pralert" type="checkbox" style="width:auto" ${s.prayerAlerts?"checked":""}> تنبيهات الأذان</label><button class="btn" onclick="s.city=$('city').value;Object.keys(s.times).forEach(k=>s.times[k]=$('time'+k).value);s.prayerAlerts=$('pralert').checked;save();toast('تم حفظ الأوقات');settings('prayer')">حفظ الأوقات</button><p class="muted small">الإيقاف التلقائي عند الصلاة يحتاج مواقيت دقيقة وخدمة تعمل بالخلفية؛ المتصفح لا يضمن ذلك إذا أُغلقت الصفحة.</p>`;
let appearance=`<h2>المظهر</h2><div class="choicegrid"><button class="choice" onclick="s.theme='dark';document.body.classList.remove('light');save();settings('appearance')">🌌 داكن — فضاء</button><button class="choice" onclick="s.theme='light';document.body.classList.add('light');save();settings('appearance')">☀️ فاتح — سماء</button></div>`;
modal(`<div class="between"><h2>الإعدادات</h2><button class="btn secondary" onclick="close()">✕</button></div><div class="subnav"><button onclick="settings('account')">الحساب</button><button onclick="settings('prayer')">الصلاة</button><button onclick="settings('appearance')">المظهر</button></div>${which==="prayer"?prayer:which==="appearance"?appearance:account}`)}
async function changePass(){if(!sb)return toast("تغيير كلمة المرور يحتاج ربط Supabase");let{error}=await sb.auth.resetPasswordForEmail(s.email,{redirectTo:location.href});toast(error?error.message:"أرسلنا رابط تغيير كلمة المرور")}
function store(){modal(`<h2>متجر المجرة ✦</h2><p>رصيدك: ${s.coins} نقطة</p><div class="grid three">${[["👽","قناع فضائي",10],["🧑🏻‍🚀","بدلة رائد فضاء",20],["🌌","خلفية مجرية",25],["🪐","كوكب لامع",30],["🛸","مركبة فضائية",35],["✨","هالة نجمية",15]].map(x=>`<div class="card" style="text-align:center"><div style="font-size:2rem">${x[0]}</div><b>${x[1]}</b><p>${x[2]} ✦</p><button class="btn" onclick="buy('${x[1]}',${x[2]})">شراء</button></div>`).join("")}</div>`)}
function buy(n,c){if(s.coins<c)return toast("رصيدك لا يكفي");s.coins-=c;s.unlocked.push(n);save();toast("تم شراء "+n);store()}
function safeBoot(){if(!sb)return;sb.auth.onAuthStateChange((event,session)=>{if(event==="PASSWORD_RECOVERY")toast("يمكنك تعيين كلمة مرور جديدة من صفحة الاستعادة")})}boot();safeBoot();
</script></body></html>
